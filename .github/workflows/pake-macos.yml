name: Build DeepSeek Harness macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: pake-build
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS app and DMG
    runs-on: macos-13
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build .app bundle
        run: pake --config app.json --json --targets app

      - name: Build .dmg installer
        run: pake --config app.json --json --targets dmg

      - name: Zip .app
        run: |
          ditto -c -k --keepParent "DeepSeek Harness.app" "DeepSeek Harness.app.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-macOS
          path: |
            DeepSeek Harness.app.zip
            DeepSeek Harness.dmg
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DeepSeek Harness.app.zip
            DeepSeek Harness.dmg

