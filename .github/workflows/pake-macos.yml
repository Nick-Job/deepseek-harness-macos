name: Build DeepSeek Harness macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: pake-build
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS app and DMG
    # macos-15 (arm64) 为当前维护的 runner;multiArch 会交叉编译出 universal 通用版。
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pake 底层是 Tauri（Rust），构建应用必须要有 Rust 工具链
      # 参考 Pake 官方 CI：https://github.com/tw93/Pake/blob/main/.github/workflows/pake-cli.yaml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # app.json 启用了 multiArch（Intel + Apple Silicon 通用版），
      # 需要同时安装两个 macOS 目标工具链，与 runner 架构无关
      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 锁定 pake-cli 版本，保证构建可复现；需要升级时改这里即可
      - name: Install Pake CLI
        run: npm install -g pake-cli@3.15.6

      # 只编译 .app（--targets app），之后再注入内置运行时和启动壳，
      # 最后统一打包 DMG，避免 DMG 里是不带运行时/启动壳的旧 App。
      - name: Build .app
        run: pake --config app.json --targets app --json

      # 下载 Node（arm64+x64 → lipo 通用版）并安装 dsh 到 runtime/ 目录
      - name: Bundle built-in runtime
        run: ./scripts/bundle-runtime.sh

      # 把 runtime 塞进 App，并用带自动启动逻辑的启动壳替换默认入口
      - name: Inject runtime and launcher
        run: |
          set -e
          APP="DeepSeek Harness.app"
          # 1) 放入内置运行时
          mkdir -p "$APP/Contents/Resources/runtime"
          cp -R runtime/. "$APP/Contents/Resources/runtime/"
          # 2) 原二进制改名为 -bin，由启动壳负责拉起
          BIN_DIR="$APP/Contents/MacOS"
          mv "$BIN_DIR/pake-deepseekharness" "$BIN_DIR/pake-deepseekharness-bin"
          cp scripts/launcher.sh "$BIN_DIR/pake-deepseekharness"
          chmod +x "$BIN_DIR/pake-deepseekharness"
          # 3) 修改了 bundle 内容，重新做 ad-hoc 签名
          codesign --force --deep --sign - "$APP"

      - name: Create DMG
        run: |
          hdiutil create -volname "DeepSeek Harness" \
            -srcfolder "DeepSeek Harness.app" \
            -ov -format UDZO "DeepSeek Harness.dmg"

      - name: Zip .app
        run: |
          ditto -c -k --keepParent "DeepSeek Harness.app" "DeepSeek Harness.app.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-macOS
          path: |
            DeepSeek Harness.app.zip
            DeepSeek Harness.dmg
          if-no-files-found: error

      # 标签触发时发布到 GitHub Release；overwrite 允许重复运行同一标签时覆盖资产
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite: true
          files: |
            DeepSeek Harness.app.zip
            DeepSeek Harness.dmg
