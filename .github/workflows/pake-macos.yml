name: Build DeepSeek Harness macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: pake-build
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS app and DMG
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pake 底层是 Tauri（Rust），构建应用必须要有 Rust 工具链
      # 参考 Pake 官方 CI：https://github.com/tw93/Pake/blob/main/.github/workflows/pake-cli.yaml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # app.json 启用了 multiArch（Intel + Apple Silicon 通用版）。
      # macos-13 是 Intel runner，需要额外安装 arm64 目标才能交叉编译出 universal 二进制。
      - name: Add aarch64 Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 锁定 pake-cli 版本，保证构建可复现；需要升级时改这里即可
      - name: Install Pake CLI
        run: npm install -g pake-cli@3.15.6

      - name: Build .app bundle
        run: pake --config app.json --json --targets app

      - name: Build .dmg installer
        run: pake --config app.json --json --targets dmg

      - name: Zip .app
        run: |
          ditto -c -k --keepParent "DeepSeek Harness.app" "DeepSeek Harness.app.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-macOS
          path: |
            DeepSeek Harness.app.zip
            DeepSeek Harness.dmg
          if-no-files-found: error

      # 标签触发时发布到 GitHub Release；overwrite 允许重复运行同一标签时覆盖资产
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite: true
          files: |
            DeepSeek Harness.app.zip
            DeepSeek Harness.dmg
