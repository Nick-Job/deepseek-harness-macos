name: Build DeepSeek Harness macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: pake-build
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS app and DMG
    # macos-13 (Intel) 已被 GitHub 弃用，改用当前维护的 macos-15 (arm64)。
    # multiArch 会在任意架构的 runner 上交叉编译出 universal 通用版。
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pake 底层是 Tauri（Rust），构建应用必须要有 Rust 工具链
      # 参考 Pake 官方 CI：https://github.com/tw93/Pake/blob/main/.github/workflows/pake-cli.yaml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # app.json 启用了 multiArch（Intel + Apple Silicon 通用版），
      # 需要同时安装两个 macOS 目标工具链，与 runner 架构无关
      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 锁定 pake-cli 版本，保证构建可复现；需要升级时改这里即可
      - name: Install Pake CLI
        run: npm install -g pake-cli@3.15.6

      # 一次编译同时产出 .app 和 .dmg（macOS 默认 bundle targets 为 app + dmg）。
      # 不要拆成 --targets app / --targets dmg 两步，那样会重复编译两次，白白拉长构建时间。
      - name: Build .app and .dmg
        run: pake --config app.json --json

      - name: Zip .app
        run: |
          ditto -c -k --keepParent "DeepSeek Harness.app" "DeepSeek Harness.app.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-macOS
          path: |
            DeepSeek Harness.app.zip
            DeepSeek Harness.dmg
          if-no-files-found: error

      # 标签触发时发布到 GitHub Release；overwrite 允许重复运行同一标签时覆盖资产
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite: true
          files: |
            DeepSeek Harness.app.zip
            DeepSeek Harness.dmg
